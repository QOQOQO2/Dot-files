[window]

[window.padding]
y = 12
x = 12

[font]
normal = { family = "CaskaydiaCove Nerd Font Propo", style = "Bold" }
size = 10

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Underline", blinking = "Off" }

[bell]
command = { program = "pw-play", args = ["/run/current-system/sw/share/sounds/freedesktop/stereo/bell.oga"] }

[terminal]
shell = "zsh"

[mouse]
hide_when_typing = true

# --- Catppuccin theme ---
[colors.primary]
foreground = "#cdd6f4"
background = "#1e1e2e"

[colors.cursor]
# cursor = "#cdd6f4"
cursor = "CellForeground"
text = "CellBackground"

[colors.selection]
background = "#353748"
text = "CellForeground"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[colors.bright]
black = "#585b70"
red = "#f37799"
green = "#89d88b"
yellow = "#ebd391"
blue = "#74a8fc"
magenta = "#f2aede"
cyan = "#6bd7ca"
white = "#bac2de"

