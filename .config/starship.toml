"$schema" = 'https://starship.rs/config-schema.json'

format = "$git_branch$git_status$cmd_duration$directory$nix_shell$character"
add_newline = false

[nix_shell]
disabled = false 
format = "[ ](bold cyan)"
heuristic = false

[directory]
style = "bold blue"
read_only_style = "bold red"
truncation_length = 10
truncate_to_repo = true
format = "[$path]($style) "
read_only = " 󰌾 "

[cmd_duration]
min_time = 5_000
format = "took [$duration](bold yellow) "

[time]

[git_branch]
symbol = " "

[character]
success_symbol = "[>](bold white)"
error_symbol   = "[>](bold red)"

